<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2f3e63;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
            cursor: pointer;
        }

        .title {
            text-align: left;
        }
    </style>
</head>

<body>

    <h2>📰 자유게시판</h2>

    <table>
        <tr>
            <th>번호</th>
            <th class="title">제목</th>
            <th>작성자</th>
        </tr>

        <tr>
            <td>1</td>
            <td class="title">배그 최적화 설정 공유</td>
            <td>유저1</td>
        </tr>

        <tr>
            <td>2</td>
            <td class="title">요즘 총 뭐가 좋음?</td>
            <td>유저2</td>
        </tr>

        <tr>
            <td>3</td>
            <td class="title">RTX 3060 괜찮나요?</td>
            <td>유저3</td>
        </tr>

    </table>

</body>

</html>
